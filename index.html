<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Site In Progress</title>

    <style>
      body {
        background-color: #f1f1f1;
        margin: 0;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      }

      .container {
        margin: 80px auto 40px auto;
        width: 600px;
        text-align: center;
      }

      h1 {
        letter-spacing: -1px;
        line-height: 60px;
        font-size: 56px;
        font-weight: 100;
        margin: 0 0 20px 0;
        text-shadow: 0 1px 0 #fff;
      }

      p {
        color: rgba(0, 0, 0, 0.55);
        margin: 12px 0;
        line-height: 1.6;
        font-size: 15px;
      }

      a {
        color: #4183c4;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      #dev-note {
        display: none;
        margin-top: 30px;
        padding: 12px;
        background: #fafafa;
        border: 1px solid #ddd;
        border-radius: 4px;
        color: #666;
        font-size: 14px;
      }

      code {
        background: #eee;
        padding: 2px 5px;
        border-radius: 3px;
        font-family: Consolas, Monaco, monospace;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Coming Soon</h1>

      <p><strong>This site is currently under development.</strong></p>

      <p>
        We're working hard behind the scenes to bring something awesome online.
      </p>

      <br>

      <p>
        Devs, if you can see this, the website is <b>online</b> and <b>working</b>.
      </p>

      <p>
        <a href="mailto:itzjpn@outlook.com">Contact Webmaster</a>
      </p>

      <div id="dev-note"></div>
    </div>

    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const url = params.get("url");

        if (url) {
          const note = document.getElementById("dev-note");

          const escapedURL = url
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

          note.innerHTML =
            'Note to devs: <code>' +
            escapedURL +
            '</code> is currently functioning. The DNS is set up correctly.';

          note.style.display = "block";
        }
      })();
    </script>
  </body>
</html>
