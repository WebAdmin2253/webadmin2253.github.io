<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatter - Create Post</title>
  <link rel="icon" type="image/x-icon" href="assets/favicon.png">
  <style>
    /* RESET & BASE STYLES */
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #ffffff;
        color: #1a1a1b;
    }

    /* NAVBAR STYLES */
    .navbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 56px;
        background: white;
        border-bottom: 1px solid #edeff1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        z-index: 100;
    }
    .nav-left {
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .nav-logo {
        height: 32px;
        cursor: pointer;
    }
    .nav-right {
        display: flex;
        align-items: center;
        gap: 12px;
    }
    .welcome-text {
        font-size: 0.9rem;
        font-weight: 600;
        color: #4a4a4a;
    }

    /* BUTTONS */
    .btn {
        font-size: 14px;
        font-weight: 700;
        padding: 6px 16px;
        border-radius: 9999px;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid transparent;
        transition: background 0.2s, color 0.2s;
    }
    .btn-outline {
        border-color: #ff0000;
        color: #ff0000;
        background: transparent;
    }
    .btn-outline:hover {
        background: rgba(255, 0, 0, 0.05);
    }
    .btn-filled {
        background-color: #ff0000;
        color: white;
    }
    .btn-filled:hover {
        background-color: #cc0000;
    }
    .btn-filled:disabled {
        background-color: #ffcccc;
        color: #ffffff;
        cursor: not-allowed;
    }

    /* EDITOR CONTAINER */
    .app-container {
        max-width: 640px;
        margin: 86px auto 40px auto;
        padding: 0 16px;
    }
    .page-title {
        font-size: 18px;
        font-weight: 500;
        padding-bottom: 12px;
        border-bottom: 1px solid #edeff1;
        margin-bottom: 20px;
    }

    /* POST FORM SHEET */
    .post-editor-box {
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 16px;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        gap: 14px;
    }
    .input-field {
        width: 100%;
        border: 1px solid #edeff1;
        border-radius: 4px;
        padding: 10px 12px;
        font-family: inherit;
        font-size: 14px;
        outline: none;
        color: #1a1a1b;
    }
    .input-field:focus {
        border-color: #ff0000;
    }
    .post-textarea {
        width: 100%;
        min-height: 160px;
        border: 1px solid #edeff1;
        border-radius: 4px;
        padding: 12px;
        font-family: inherit;
        font-size: 14px;
        resize: vertical;
        outline: none;
        color: #1a1a1b;
    }
    .post-textarea:focus {
        border-color: #ff0000;
    }
    .editor-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 4px;
    }
    .char-counter {
        font-size: 12px;
        color: #7c7c7c;
    }
  </style>
</head>
<body>

<header class="navbar">
  <div class="nav-left">
    <a href="home.html">
        <img src="assets/CHATTER_PNG.png" alt="Chatter" class="nav-logo">
    </a>
  </div>
  
  <div class="nav-right">
    <span id="welcomeUser" class="welcome-text" style="display: none;"></span>
    <a class="btn btn-outline" href="home.html">Back to Feed</a>
  </div>
</header>

<main class="app-container">
    <h2 class="page-title">Create a post</h2>
    
    <div class="post-editor-box">
        <select id="postCommunity" class="input-field" style="background: white; cursor: pointer;">
            <option value="all">c/all (General Feed)</option>
            </select>

        <input 
            type="text" 
            id="postTitle" 
            class="input-field" 
            placeholder="An interesting title" 
            maxlength="100"
        />

        <input 
            type="text" 
            id="postId" 
            class="input-field" 
            placeholder="Custom Post URL ID (e.g., my-first-chatter) - Optional" 
            maxlength="50"
        />

        <textarea 
            id="postTextarea" 
            class="post-textarea" 
            placeholder="What's on your mind? (Markdown supported)"
            maxlength="2000"
        ></textarea>
        
        <div class="editor-footer">
            <span id="charCount" class="char-counter">0 / 2000</span>
            <button id="publishPostBtn" class="btn btn-filled">Post</button>
        </div>
    </div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getDatabase, ref, set, push, get, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAyKbmWh1MZJiwSQ5DVlmt7Lgz9e7oY82A",
    authDomain: "new-chatter-68eb4.firebaseapp.com",
    projectId: "new-chatter-68eb4",
    storageBucket: "new-chatter-68eb4.firebasestorage.app",
    messagingSenderId: "253944755091",
    appId: "1:253944755091:web:c7891e34d97e414f9b6e66",
    databaseURL: "https://new-chatter-68eb4-default-rtdb.firebaseio.com"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const rtdb = getDatabase(app);

  // 1. LOCAL STORAGE USER RECOVERY
  const currentUserJson = localStorage.getItem("currentUser");
  let currentUser = null;

  if (currentUserJson) {
    try {
      currentUser = JSON.parse(currentUserJson);
    } catch (e) {
      currentUser = null; 
    }
  }

  const welcomeUser = document.getElementById("welcomeUser");
  const activeUsername = currentUser?.username || null;

  if (!activeUsername) {
      alert("You must be logged in to view this page.");
      window.location.href = "login.html";
  } else {
      welcomeUser.textContent = `u/${activeUsername}`;
      welcomeUser.style.display = "inline";
  }

  // 2. VERIFY FIREBASE AUTH CLIENT IS READY
  let isFirebaseAuthed = false;
  onAuthStateChanged(auth, (user) => {
      if (user) {
          isFirebaseAuthed = true;
      } else {
          isFirebaseAuthed = false;
      }
  });

  // 3. DYNAMIC COMMUNITIES DROPDOWN POPULATION
  const postCommunitySelect = document.getElementById("postCommunity");
  
  async function loadDatabaseCommunities() {
      try {
          const communitiesRef = ref(rtdb, "communities");
          const snapshot = await get(communitiesRef);
          
          if (snapshot.exists()) {
              snapshot.forEach((childSnapshot) => {
                  const communityId = childSnapshot.key;
                  const communityData = childSnapshot.val();
                  
                  // Use name if saved under child property, otherwise fallback to key node string
                  const displayTitle = communityData.name || communityId; 
                  
                  const optionElement = document.createElement("option");
                  optionElement.value = communityId;
                  optionElement.textContent = `c/${displayTitle}`;
                  postCommunitySelect.appendChild(optionElement);
              });
          }
      } catch (err) {
          console.error("Error loading communities: ", err);
      }
  }

  // Call the pull method on file initialization
  loadDatabaseCommunities();

  // CHARACTER WRITER COUNTER TRIGGER
  const postTextarea = document.getElementById("postTextarea");
  const charCount = document.getElementById("charCount");

  postTextarea.addEventListener("input", () => {
      charCount.textContent = `${postTextarea.value.length} / 2000`;
  });

  // PUBLISH ACTION PIPELINE
  const publishPostBtn = document.getElementById("publishPostBtn");
  const postTitle = document.getElementById("postTitle");
  const postIdInput = document.getElementById("postId");

  publishPostBtn.onclick = async () => {
      const titleText = postTitle.value.trim();
      const customIdText = postIdInput.value.trim().toLowerCase().replace(/[^a-z0-9-_]/g, '-'); 
      const contentText = postTextarea.value.trim();
      const targetCommunity = postCommunitySelect.value;
      
      if (!titleText) {
          alert("Your post needs a title!");
          return;
      }
      if (!contentText) {
          alert("Your post cannot be empty!");
          return;
      }

      if (!isFirebaseAuthed && auth.currentUser === null) {
          alert("Firebase session sync incomplete. Please wait one second and try clicking Post again.");
          return;
      }

      publishPostBtn.disabled = true;
      publishPostBtn.textContent = "Posting...";

      try {
          let targetRef;
          let finalId = customIdText;

          if (customIdText) {
              targetRef = ref(rtdb, `posts/${customIdText}`);
              const duplicateCheck = await get(targetRef);
              if (duplicateCheck.exists()) {
                  alert("This Custom Post ID is already taken! Please choose another one.");
                  publishPostBtn.disabled = false;
                  publishPostBtn.textContent = "Post";
                  return;
              }
          } else {
              const postsListRef = ref(rtdb, 'posts');
              targetRef = push(postsListRef);
              finalId = targetRef.key;
          }

          await set(targetRef, {
              id: finalId,
              title: titleText,
              community: targetCommunity,
              username: activeUsername,
              content: contentText,
              timestamp: serverTimestamp()
          });

          window.location.href = "home.html";
      } catch (error) {
          console.error("Database write rejection payload description: ", error);
          alert(`Could not save post. Reason: ${error.message}`);
          publishPostBtn.disabled = false;
          publishPostBtn.textContent = "Post";
      }
  };
</script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  // Ensure this matches your project configuration
  const firebaseConfig = {
    apiKey: "AIzaSyAyKbmWh1MZJiwSQ5DVlmt7Lgz9e7oY82A",
    authDomain: "new-chatter-68eb4.firebaseapp.com",
    projectId: "new-chatter-68eb4",
    storageBucket: "new-chatter-68eb4.firebasestorage.app",
    messagingSenderId: "253944755091",
    appId: "1:253944755091:web:c7891e34d97e414f9b6e66",
    databaseURL: "https://new-chatter-68eb4-default-rtdb.firebaseio.com"
  };

  const app = initializeApp(firebaseConfig);
  const rtdb = getDatabase(app);

  async function enforceBanRestrictions() {
      const currentUserJson = localStorage.getItem("currentUser");
      if (!currentUserJson) return; // Not logged in

      try {
          const activeUser = JSON.parse(currentUserJson);
          if (!activeUser || !activeUser.username) return;

          // Prevent infinite redirect loop if already on banned.html
          if (window.location.pathname.endsWith("banned.html")) return;

          const usersRef = ref(rtdb, "users");
          const snap = await get(usersRef);

          if (snap.exists()) {
              snap.forEach((child) => {
                  const uData = child.val();
                  if (uData.username && uData.username.toLowerCase() === activeUser.username.toLowerCase()) {
                      if (uData.banned === true) {
                          window.location.href = "banned.html";
                      }
                  }
              });
          }
      } catch (e) {
          console.error("Restriction check error:", e);
      }
  }

  enforceBanRestrictions();
</script>
</body>
</html>
