<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/signin_login.css">
</head>
<body>

<div class="box">
    <h2 class="textcolorred">
        Login to Chatter
    </h2>

    <input
        type="email"
        id="login"
        placeholder="Email"
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
    >

    <button id="loginBtn">
        Login
    </button>

    <p>
        Need a Chatter account?
        <a href="signup.html">Sign Up</a>
    </p>
</div>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getDatabase,
    ref,
    get
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyAyKbmWh1MZJiwSQ5DVlmt7Lgz9e7oY82A",
    authDomain: "new-chatter-68eb4.firebaseapp.com",
    projectId: "new-chatter-68eb4",
    storageBucket: "new-chatter-68eb4.firebasestorage.app",
    messagingSenderId: "253944755091",
    appId: "1:253944755091:web:c7891e34d97e414f9b6e66"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

//
// =========================
// LOGIN LOGIC
// =========================
//
const loginBtn = document.getElementById("loginBtn");

loginBtn.addEventListener("click", async () => {
    const email = document.getElementById("login").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
        alert("Please fill in all fields.");
        return;
    }

    loginBtn.disabled = true;
    loginBtn.innerText = "Logging in...";

    try {
        // 1. Auth login
        const userCredential = await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        const user = userCredential.user;

        // 2. Load profile
        const snap = await get(ref(db, "users/" + user.uid));
        let profile = {};

        if (snap.exists()) {
            profile = snap.val();
        }

        // 3. Save session locally
        localStorage.setItem(
            "currentUser",
            JSON.stringify({
                uid: user.uid,
                email: user.email,
                username: profile.username || "",
                role: profile.role || "member"
            })
        );

        // 4. Redirect
        window.location.href = "home.html";

    } catch (error) {
        console.error(error);
        alert(error.message);
        loginBtn.disabled = false;
        loginBtn.innerText = "Login";
    }
});
</script>

</body>
</html>
