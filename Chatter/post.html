<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatter - View Post</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    /* RESET & BASE STYLES */
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #ffffff;
        color: #1a1a1b;
    }

    /* NAVBAR STYLES */
    .navbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 56px;
        background: white;
        border-bottom: 1px solid #edeff1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        z-index: 100;
    }
    .nav-left {
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .nav-logo {
        height: 32px;
        cursor: pointer;
    }
    .nav-right {
        display: flex;
        align-items: center;
        gap: 12px;
    }
    .welcome-text {
        font-size: 0.9rem;
        font-weight: 600;
        color: #4a4a4a;
    }

    /* BUTTONS */
    .btn {
        font-size: 14px;
        font-weight: 700;
        padding: 6px 16px;
        border-radius: 9999px;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid transparent;
        transition: background 0.2s, color 0.2s;
    }
    .btn-outline {
        border-color: #ff0000;
        color: #ff0000;
        background: transparent;
    }
    .btn-outline:hover {
        background: rgba(255, 0, 0, 0.05);
    }
    .btn-filled {
        background-color: #ff0000;
        color: white;
    }
    .btn-filled:hover {
        background-color: #cc0000;
    }
    
    /* UTILITY BUTTON FOR FORUM TOOLBAR */
    .btn-utility {
        background: #f6f8fa;
        border: 1px solid #edeff1;
        color: #4a4a4a;
        padding: 4px 10px;
        font-size: 12px;
        font-weight: 600;
        border-radius: 4px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        width: fit-content;
    }
    .btn-utility:hover {
        background: #edeff1;
    }

    /* POST DISPLAY CONTAINER */
    .app-container {
        max-width: 640px;
        margin: 86px auto 40px auto;
        padding: 0 16px;
    }

    /* VOTING WRAPPER */
    .post-layout-wrapper {
        display: flex;
        gap: 12px;
    }
    .voting-column {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 20px;
        gap: 4px;
    }
    .vote-btn {
        background: none;
        border: none;
        font-size: 20px;
        cursor: pointer;
        color: #878a8c;
        transition: color 0.2s;
    }
    .vote-btn.voted {
        color: #ff0000 !important;
    }
    .vote-btn:hover {
        color: #ff0000;
    }
    .vote-count {
        font-size: 13px;
        font-weight: 700;
    }

    .post-view-card {
        background: white;
        padding: 20px 20px 20px 0;
        border-bottom: 1px solid #edeff1;
        flex: 1;
    }
    .post-meta {
        font-size: 12px;
        color: #787c7e;
        margin-bottom: 12px;
        display: flex;
        gap: 6px;
        align-items: center;
    }
    .post-author {
        color: #1a1a1b;
        font-weight: 600;
    }
    .badge-admin {
        background-color: #ff0000;
        color: white;
        font-size: 10px;
        font-weight: bold;
        padding: 2px 6px;
        border-radius: 4px;
        text-transform: uppercase;
    }
    .post-title {
        font-size: 22px;
        font-weight: 600;
        margin-bottom: 8px;
        color: #1a1a1b;
    }
    .post-owner-actions {
        display: flex;
        gap: 12px;
        margin-bottom: 16px;
    }

    /* MARKDOWN CONTENT RENDERING STYLES */
    .post-rendered-content, .comment-body {
        font-size: 15px;
        line-height: 1.6;
        color: #1a1a1b;
    }
    .post-rendered-content p, .comment-body p {
        margin-bottom: 12px;
    }
    .post-rendered-content h1, .comment-body h1,
    .post-rendered-content h2, .comment-body h2,
    .post-rendered-content h3, .comment-body h3 {
        margin: 16px 0 8px 0;
        font-weight: 600;
        font-size: 1.2rem;
    }
    .post-rendered-content ul, .comment-body ul,
    .post-rendered-content ol, .comment-body ol {
        margin-left: 20px;
        margin-bottom: 12px;
    }
    .post-rendered-content code, .comment-body code {
        background: #f6f8fa;
        padding: 2px 6px;
        border-radius: 4px;
        font-family: monospace;
        font-size: 85%;
    }
    .post-rendered-content pre, .comment-body pre {
        background: #f6f8fa;
        padding: 12px;
        border-radius: 6px;
        overflow-x: auto;
        margin-bottom: 12px;
    }
    .post-rendered-content pre code, .comment-body pre code {
        background: transparent;
        padding: 0;
    }
    .post-rendered-content blockquote, .comment-body blockquote {
        border-left: 4px solid #ff0000;
        padding-left: 12px;
        color: #4a4a4a;
        font-style: italic;
        margin-bottom: 12px;
    }

    /* INLINE CHATTER FORMAT LINKS */
    .chatter-community-link {
        color: #ff0000;
        text-decoration: none;
        font-weight: 600;
    }
    .chatter-community-link:hover {
        text-decoration: underline;
    }
    .chatter-user-mention {
        color: #0079d3;
        font-weight: 600;
        text-decoration: none;
    }
    .chatter-user-mention:hover {
        text-decoration: underline;
    }

    /* IMAGE AND GIF MAX BOUNDS FOR COMMENTS */
    .comment-body img, .post-rendered-content img {
        max-width: 100%;
        max-height: 300px;
        border-radius: 6px;
        margin-top: 8px;
        display: block;
        object-fit: contain;
    }

    /* YOUTUBE EMBED CONTAINER */
    .youtube-embed-wrapper {
        position: relative;
        padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
        height: 0;
        overflow: hidden;
        max-width: 100%;
        background: #000;
        border-radius: 6px;
        margin: 12px 0;
    }
    .youtube-embed-wrapper iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: 0;
    }

    /* COMMENTS BOX STYLES */
    .comments-section {
        margin-top: 24px;
        padding: 20px 0;
    }
    .comments-heading {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 16px;
    }
    .comment-form {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 16px;
        margin-top: 8px;
    }
    .comment-input {
        width: 100%;
        min-height: 80px;
        padding: 12px;
        border: 1px solid #edeff1;
        border-radius: 6px;
        font-family: inherit;
        font-size: 14px;
        outline: none;
        resize: vertical;
    }
    .comment-input:focus {
        border-color: #ff0000;
    }
    .comment-form .btn {
        align-self: flex-end;
    }
    .comments-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    .comment-card {
        padding: 12px 0 8px 0;
        border-left: 2px solid #edeff1;
        padding-left: 14px;
        margin-top: 8px;
    }
    .comment-card.root-comment {
        border-left: none;
        padding-left: 0;
        border-bottom: 1px solid #f6f8fa;
    }
    .comment-meta {
        font-size: 12px;
        color: #787c7e;
        margin-bottom: 6px;
        display: flex;
        gap: 6px;
        align-items: center;
    }
    .comment-author {
        font-weight: 600;
        color: #1a1a1b;
    }
    .comment-actions {
        display: flex;
        gap: 12px;
        margin-bottom: 4px;
    }
    .action-link {
        font-size: 12px;
        color: #878a8c;
        background: none;
        border: none;
        font-weight: 700;
        cursor: pointer;
    }
    .action-link:hover {
        color: #ff0000;
    }
    .replies-container {
        margin-top: 4px;
    }

    .loader-text {
        text-align: center;
        padding: 40px;
        color: #7c7c7c;
    }
  </style>
</head>
<body>

<header class="navbar">
  <div class="nav-left">
    <a href="home.html">
        <img src="assets/CHATTER_PNG.png" alt="Chatter" class="nav-logo">
    </a>
  </div>
  
  <div class="nav-right">
    <span id="welcomeUser" class="welcome-text" style="display: none;"></span>
    <a class="btn btn-outline" href="home.html">Back to Feed</a>
  </div>
</header>

<main class="app-container">
    <div class="post-layout-wrapper">
        <div class="voting-column">
            <button class="vote-btn" id="postUpvote">▲</button>
            <span class="vote-count" id="postScore">0</span>
            <button class="vote-btn" id="postDownvote">▼</button>
        </div>
        <div id="postContainer" style="width: 100%;">
            <div class="loader-text">Loading post content...</div>
        </div>
    </div>

    <div class="comments-section">
        <h3 class="comments-heading">Comments</h3>
        
        <div id="commentFormContainer">
            <p class="loader-text" style="padding: 10px 0; font-size: 14px;">Please log in to leave a comment.</p>
        </div>

        <div id="commentsList" class="comments-list">
            <div class="loader-text" style="padding: 20px 0;">Loading thread responses...</div>
        </div>
    </div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, get, push, set, remove, onValue, runTransaction, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAyKbmWh1MZJiwSQ5DVlmt7Lgz9e7oY82A",
    authDomain: "new-chatter-68eb4.firebaseapp.com",
    projectId: "new-chatter-68eb4",
    storageBucket: "new-chatter-68eb4.firebasestorage.app",
    messagingSenderId: "253944755091",
    appId: "1:253944755091:web:c7891e34d97e414f9b6e66",
    databaseURL: "https://new-chatter-68eb4-default-rtdb.firebaseio.com"
  };

  const app = initializeApp(firebaseConfig);
  const rtdb = getDatabase(app);

  const currentUserJson = localStorage.getItem("currentUser");
  let activeUser = null;
  let activeUserIsAdmin = false;

  const urlParams = new URLSearchParams(window.location.search);
  const postId = urlParams.get('pid');

  const postContainer = document.getElementById("postContainer");
  const commentFormContainer = document.getElementById("commentFormContainer");
  const commentsListElement = document.getElementById("commentsList");

  let originalPostAuthor = "";

  marked.setOptions({ sanitize: true, breaks: true });

  async function initializeFlow() {
      if (currentUserJson) {
          try {
              activeUser = JSON.parse(currentUserJson);
              if (activeUser?.username) {
                  const welcomeUser = document.getElementById("welcomeUser");
                  welcomeUser.textContent = `u/${activeUser.username}`;
                  welcomeUser.style.display = "inline";
                  
                  // Run lookup against UID architecture
                  activeUserIsAdmin = await checkIsAdmin(activeUser.username);
              }
          } catch (e) { console.error(e); }
      }

      if (!postId) {
          postContainer.innerHTML = "<div class='loader-text'>Error: No post ID specified in the URL.</div>";
          commentsListElement.innerHTML = "";
      } else {
          fetchPostDetails(postId);
          setupCommentForm();
          streamComments(postId);
          setupVoting(postId);
      }
  }

  initializeFlow();

  window.checkIfOP = function(targetUser) {
      if (!originalPostAuthor) return;
      if (targetUser.toLowerCase() === originalPostAuthor.toLowerCase()) {
          alert(`u/${targetUser} is the Original Poster (OP) of this thread.`);
      } else {
          alert(`u/${targetUser} is not the OP.`);
      }
  };

  // Extracts YouTube ID from common video link formats
  function getYouTubeId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
  }

  function parseChatterMentions(htmlContent) {
      let result = htmlContent.replace(/\bc\/([a-zA-Z0-9_\-]+)/g, '<a class="chatter-community-link" href="home.html?c=$1">c/$1</a>');
      result = result.replace(/\bu\/([a-zA-Z0-9_\-]+)/g, '<a class="chatter-user-mention" href="user.html?u=$1">u/$1</a>');
      
      // Parse custom !(YT)(URL) format into responsive iframes
      result = result.replace(/!\(YT\)\(([^)]+)\)/g, (match, url) => {
          const videoId = getYouTubeId(url.trim());
          if (videoId) {
              return `<div class="youtube-embed-wrapper">
                        <iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe>
                      </div>`;
          }
          return `<div style="color: #787c7e; font-size: 13px; font-style: italic;">[Invalid YouTube Link Provided]</div>`;
      });

      return result;
  }

  // Inserts generic tags at textareas selection cursor bounds
  function insertUtilityToken(textareaId, mode) {
      const textarea = document.getElementById(textareaId);
      if (!textarea) return;

      const startPos = textarea.selectionStart;
      const endPos = textarea.selectionEnd;
      const textVal = textarea.value;
      const token = mode === 'photo' ? "![User Attached Image]()" : "!(YT)()";

      textarea.value = textVal.substring(0, startPos) + token + textVal.substring(endPos, textVal.length);
      
      textarea.focus();
      const newCursorPos = startPos + token.length - 1;
      textarea.setSelectionRange(newCursorPos, newCursorPos);
  }

  async function checkIsAdmin(username) {
      if (!username || username === "deleted") return false;
      try {
          const usersRef = ref(rtdb, "users");
          const snap = await get(usersRef);
          if (snap.exists()) {
              let foundAdminStatus = false;
              snap.forEach((userChild) => {
                  const userData = userChild.val();
                  if (userData.username && userData.username.toLowerCase() === username.toLowerCase()) {
                      if (userData.admin === true) {
                          foundAdminStatus = true;
                      }
                  }
              });
              return foundAdminStatus;
          }
      } catch (e) { console.error(e); }
      return false;
  }

  async function fetchPostDetails(id) {
      try {
          const postRef = ref(rtdb, `posts/${id}`);
          const snapshot = await get(postRef);

          if (!snapshot.exists()) {
              postContainer.innerHTML = "<div class='loader-text'>Post not found. It may have been deleted.</div>";
              return;
          }

          const postData = snapshot.val();
          originalPostAuthor = postData.username || "anonymous";
          
          const postDate = postData.timestamp ? new Date(postData.timestamp).toLocaleDateString() : "Just now";
          const renderedMarkdown = marked.parse(postData.content || "");
          const parsedContent = parseChatterMentions(renderedMarkdown);
          
          const authorIsAdmin = await checkIsAdmin(postData.username);
          const adminBadgeHtml = authorIsAdmin ? `<span class="badge-admin">admin</span>` : '';

          let ownerActionsHtml = "";
          if (activeUser && (activeUser.username === postData.username || activeUserIsAdmin)) {
              ownerActionsHtml = `
                  <div class="post-owner-actions">
                      <button class="action-link" id="editPostBtn">Edit Post ${activeUserIsAdmin && activeUser.username !== postData.username ? '(Mod)' : ''}</button>
                      <button class="action-link" id="deletePostBtn" style="color: #ff0000;">Delete Post</button>
                  </div>
              `;
          }

          postContainer.innerHTML = `
              <div class="post-view-card" id="postCardBody">
                  <div class="post-meta">
                      <span>Posted by</span>
                      <a class="post-author" style="cursor:pointer; text-decoration:none;" href="user.html?u=${originalPostAuthor}">u/${originalPostAuthor}</a>
                      ${adminBadgeHtml}
                      <span>•</span>
                      <span>${postDate}</span>
                  </div>
                  <h1 class="post-title">${escapeHTML(postData.title || "Untitled Post")}</h1>
                  ${ownerActionsHtml}
                  <div class="post-rendered-content" id="postMainContentContainer">${parsedContent}</div>
              </div>
          `;

          if (activeUser && (activeUser.username === postData.username || activeUserIsAdmin)) {
              document.getElementById("deletePostBtn").onclick = () => deletePost(id);
              document.getElementById("editPostBtn").onclick = () => toggleEditPostForm(id, postData.content || "");
          }

      } catch (error) {
          console.error(error);
          postContainer.innerHTML = `<div class='loader-text'>Error loading post contents.</div>`;
      }
  }

  async function deletePost(id) {
      if (!confirm("Are you sure you want to delete this post entirely? This cannot be undone.")) return;
      try {
          await remove(ref(rtdb, `posts/${id}`));
          window.location.href = "home.html";
      } catch (err) { alert(`Delete failed: ${err.message}`); }
  }

  function toggleEditPostForm(id, currentRawContent) {
      const container = document.getElementById("postMainContentContainer");
      if (document.getElementById("postEditForm")) {
          container.innerHTML = parseChatterMentions(marked.parse(currentRawContent));
          return;
      }

      container.innerHTML = `
          <form id="postEditForm" class="comment-form">
              <textarea id="postEditText" class="comment-input" required>${currentRawContent}</textarea>
              <div style="display:flex; justify-content:space-between; align-items:center;">
                  <div style="display:flex; gap:6px;">
                      <button type="button" class="btn-utility" id="editPostInsertPhoto">Photo/GIF</button>
                      <button type="button" class="btn-utility" id="editPostInsertYT">YouTube Video</button>
                  </div>
                  <div style="display:flex; gap:8px;">
                      <button type="button" class="btn btn-outline" id="cancelPostEdit">Cancel</button>
                      <button type="submit" class="btn btn-filled">Save Changes</button>
                  </div>
              </div>
          </form>
      `;

      document.getElementById("editPostInsertPhoto").onclick = () => insertUtilityToken("postEditText", "photo");
      document.getElementById("editPostInsertYT").onclick = () => insertUtilityToken("postEditText", "yt");

      document.getElementById("cancelPostEdit").onclick = () => {
          container.innerHTML = parseChatterMentions(marked.parse(currentRawContent));
      };

      document.getElementById("postEditForm").onsubmit = async (e) => {
          e.preventDefault();
          const nextVal = document.getElementById("postEditText").value.trim();
          if (!nextVal) return;
          try {
              await update(ref(rtdb, `posts/${id}`), { content: nextVal });
              fetchPostDetails(id);
          } catch (err) { alert(err.message); }
      };
  }

  function setupVoting(id) {
      const upBtn = document.getElementById("postUpvote");
      const downBtn = document.getElementById("postDownvote");
      const scoreText = document.getElementById("postScore");
      
      const scoreRef = ref(rtdb, `posts/${id}/score`);
      const userVoteRef = activeUser ? ref(rtdb, `posts/${id}/votes/${activeUser.username}`) : null;

      onValue(scoreRef, (snap) => {
          scoreText.textContent = snap.exists() ? snap.val() : 0;
      });

      if (userVoteRef) {
          onValue(userVoteRef, (snap) => {
              upBtn.classList.remove("voted");
              downBtn.classList.remove("voted");
              if (snap.exists()) {
                  if (snap.val() === 1) upBtn.classList.add("voted");
                  if (snap.val() === -1) downBtn.classList.add("voted");
              }
          });
      }

      const handleVoteClick = async (clickedValue) => {
          if (!activeUser) { alert("Please log in to vote!"); return; }

          const currentVoteSnap = await get(userVoteRef);
          const currentVoteVal = currentVoteSnap.exists() ? currentVoteSnap.val() : 0;

          let scoreModifier = 0;
          let nextVoteVal = 0;

          if (currentVoteVal === clickedValue) {
              scoreModifier = -clickedValue;
              nextVoteVal = 0;
          } else {
              scoreModifier = clickedValue - currentVoteVal;
              nextVoteVal = clickedValue;
          }

          await set(userVoteRef, nextVoteVal === 0 ? null : nextVoteVal);
          runTransaction(scoreRef, (currentScore) => {
              return (currentScore || 0) + scoreModifier;
          });
      };

      upBtn.onclick = () => handleVoteClick(1);
      downBtn.onclick = () => handleVoteClick(-1);
  }

  function setupCommentForm() {
      if (!activeUser || !activeUser.username) return;

      commentFormContainer.innerHTML = `
          <form id="commentForm" class="comment-form">
              <textarea id="commentText" class="comment-input" placeholder="What are your thoughts? (Supports Markdown, c/, u/, embeds)" required></textarea>
              <div style="display:flex; justify-content:space-between; align-items:center; margin-top:4px;">
                  <div style="display:flex; gap:6px;">
                      <button type="button" class="btn-utility" id="commentInsertPhoto">Photo/GIF</button>
                      <button type="button" class="btn-utility" id="commentInsertYT">YouTube Video</button>
                  </div>
                  <button type="submit" class="btn btn-filled">Comment</button>
              </div>
          </form>
      `;

      document.getElementById("commentInsertPhoto").onclick = () => insertUtilityToken("commentText", "photo");
      document.getElementById("commentInsertYT").onclick = () => insertUtilityToken("commentText", "yt");

      document.getElementById("commentForm").onsubmit = async (e) => {
          e.preventDefault();
          const inputField = document.getElementById("commentText");
          let val = inputField.value.trim();
          
          if (!val) return;

          try {
              await push(ref(rtdb, `posts/${postId}/comments`), {
                  username: activeUser.username,
                  content: val,
                  timestamp: Date.now(),
                  parentId: null
              });
              inputField.value = "";
          } catch (err) { alert(err.message); }
      };
  }

  function streamComments(id) {
      onValue(ref(rtdb, `posts/${id}/comments`), async (snapshot) => {
          commentsListElement.innerHTML = "";

          if (!snapshot.exists()) {
              commentsListElement.innerHTML = "<p class='loader-text' style='text-align:left;'>No comments yet.</p>";
              return;
          }

          const commentMap = {};
          const rootComments = [];

          snapshot.forEach((child) => {
              const c = { id: child.key, ...child.val(), replies: [] };
              commentMap[c.id] = c;
          });

          Object.values(commentMap).forEach(c => {
              if (c.parentId && commentMap[c.parentId]) {
                  commentMap[c.parentId].replies.push(c);
              } else {
                  rootComments.push(c);
              }
          });

          const sortThread = (list) => {
              list.sort((a, b) => a.timestamp - b.timestamp);
              list.forEach(c => sortThread(c.replies));
          };
          sortThread(rootComments);

          for (const comment of rootComments) {
              await renderCommentTree(comment, commentsListElement, true);
          }
      });
  }

  async function renderCommentTree(comment, targetContainer, isRoot = false) {
      const commentDate = comment.timestamp ? new Date(comment.timestamp).toLocaleString() : "Just now";
      const commentAuthorAdmin = await checkIsAdmin(comment.username);
      const badgeHtml = commentAuthorAdmin ? `<span class="badge-admin">admin</span>` : '';
      
      const renderedCommentMarkdown = marked.parse(comment.content || "");
      const parsedCommentContent = parseChatterMentions(renderedCommentMarkdown);

      let commentManagementActions = "";
      if (activeUser && (activeUser.username === comment.username || activeUserIsAdmin)) {
          commentManagementActions = `
              <button class="action-link edit-comment-btn" data-id="${comment.id}">Edit ${activeUserIsAdmin && activeUser.username !== comment.username ? '(Mod)' : ''}</button>
              <button class="action-link delete-comment-btn" data-id="${comment.id}" style="color: #ff0000;">Delete</button>
          `;
      }

      const commentCard = document.createElement("div");
      commentCard.className = `comment-card ${isRoot ? 'root-comment' : ''}`;
      commentCard.id = `comment-${comment.id}`;
      commentCard.innerHTML = `
          <div class="comment-meta">
              <a class="comment-author" style="cursor:pointer; text-decoration:none;" href="user.html?u=${comment.username || "anonymous"}">u/${comment.username || "anonymous"}</a>
              ${badgeHtml}
              <span>•</span>
              <span>${commentDate}</span>
          </div>
          <div class="comment-body" id="commentBodyBox-${comment.id}">${parsedCommentContent}</div>
          <div class="comment-actions">
              <button class="action-link reply-btn" data-id="${comment.id}" data-user="${comment.username}">Reply</button>
              ${commentManagementActions}
          </div>
          <div id="replyFormBox-${comment.id}"></div>
          <div class="replies-container" id="replies-${comment.id}"></div>
      `;
      targetContainer.appendChild(commentCard);

      commentCard.querySelector(".reply-btn").onclick = () => handleReplyToggle(comment.id, comment.username);
      
      if (activeUser && (activeUser.username === comment.username || activeUserIsAdmin)) {
          commentCard.querySelector(".delete-comment-btn").onclick = () => deleteComment(comment.id);
          commentCard.querySelector(".edit-comment-btn").onclick = () => handleCommentEditToggle(comment.id, comment.content || "");
      }

      const nestedContainer = commentCard.querySelector(`#replies-${comment.id}`);
      for (const reply of comment.replies) {
          await renderCommentTree(reply, nestedContainer, false);
      }
  }

  async function deleteComment(commentId) {
      if (!confirm("Delete this comment? Replies under it will remain contextually visible.")) return;
      try {
          const deleteAuthor = activeUserIsAdmin && activeUser.username !== originalPostAuthor ? "moderator" : "original poster";
          await update(ref(rtdb, `posts/${postId}/comments/${commentId}`), {
              username: "deleted",
              content: `This comment has been deleted by a ${deleteAuthor}.`
          });
      } catch (err) { alert(err.message); }
  }

  function handleCommentEditToggle(commentId, currentRawText) {
      const displayContainer = document.getElementById(`commentBodyBox-${commentId}`);
      
      if (displayContainer.querySelector("form")) {
          displayContainer.innerHTML = parseChatterMentions(marked.parse(currentRawText));
          return;
      }

      displayContainer.innerHTML = `
          <form class="comment-form" id="editForm-${commentId}">
              <textarea class="comment-input" id="editText-${commentId}" required>${currentRawText}</textarea>
              <div style="display:flex; justify-content:space-between; align-items:center;">
                  <div style="display:flex; gap:6px;">
                      <button type="button" class="btn-utility" id="editCommentInsertPhoto-${commentId}">🖼️ Photo/GIF</button>
                      <button type="button" class="btn-utility" id="editCommentInsertYT-${commentId}">📺 YouTube Video</button>
                  </div>
                  <div style="display:flex; gap:8px;">
                      <button type="button" class="btn btn-outline cancel-edit-btn" style="padding:4px 12px; font-size:12px;">Cancel</button>
                      <button type="submit" class="btn btn-filled" style="padding:4px 12px; font-size:12px;">Save</button>
                  </div>
              </div>
          </form>
      `;

      document.getElementById(`editCommentInsertPhoto-${commentId}`).onclick = () => insertUtilityToken(`editText-${commentId}`, "photo");
      document.getElementById(`editCommentInsertYT-${commentId}`).onclick = () => insertUtilityToken(`editText-${commentId}`, "yt");

      displayContainer.querySelector(".cancel-edit-btn").onclick = () => {
          displayContainer.innerHTML = parseChatterMentions(marked.parse(currentRawText));
      };

      displayContainer.querySelector("form").onsubmit = async (e) => {
          e.preventDefault();
          const modifiedText = document.getElementById(`editText-${commentId}`).value.trim();
          if (!modifiedText) return;

          try {
              await update(ref(rtdb, `posts/${postId}/comments/${commentId}`), {
                  content: modifiedText
              });
          } catch (err) { alert(err.message); }
      };
  }

  function handleReplyToggle(commentId, targetUser) {
      if (!activeUser) { alert("Please log in to reply!"); return; }
      
      const formBox = document.getElementById(`replyFormBox-${commentId}`);
      if (formBox.innerHTML !== "") {
          formBox.innerHTML = "";
          return;
      }

      formBox.innerHTML = `
          <form class="comment-form" id="form-${commentId}">
              <textarea class="comment-input" id="text-${commentId}" placeholder="Reply to u/${targetUser}... (Supports Markdown)" required></textarea>
              <div style="display:flex; justify-content:space-between; align-items:center;">
                  <div style="display:flex; gap:6px;">
                      <button type="button" class="btn-utility" id="replyInsertPhoto-${commentId}">Photo/GIF</button>
                      <button type="button" class="btn-utility" id="replyInsertYT-${commentId}">YouTube Video</button>
                  </div>
                  <div style="display:flex; gap:8px;">
                      <button type="button" class="btn btn-outline cancel-reply-btn" style="padding:4px 12px; font-size:12px;">Cancel</button>
                      <button type="submit" class="btn btn-filled" style="padding:4px 12px; font-size:12px;">Submit</button>
                  </div>
              </div>
          </form>
      `;

      document.getElementById(`replyInsertPhoto-${commentId}`).onclick = () => insertUtilityToken(`text-${commentId}`, "photo");
      document.getElementById(`replyInsertYT-${commentId}`).onclick = () => insertUtilityToken(`text-${commentId}`, "yt");

      formBox.querySelector(".cancel-reply-btn").onclick = () => { formBox.innerHTML = ""; };

      formBox.querySelector("form").onsubmit = async (e) => {
          e.preventDefault();
          const textArea = document.getElementById(`text-${commentId}`);
          let textVal = textArea.value.trim();
          
          if (!textVal) return;

          try {
              await push(ref(rtdb, `posts/${postId}/comments`), {
                  username: activeUser.username,
                  content: textVal,
                  timestamp: Date.now(),
                  parentId: commentId
              });
              formBox.innerHTML = "";
          } catch (err) { alert(err.message); }
      };
  }

  function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
  }
</script>

  async function enforceBanRestrictions() {
      const currentUserJson = localStorage.getItem("currentUser");
      if (!currentUserJson) return;

      try {
          const activeUser = JSON.parse(currentUserJson);
          if (!activeUser || !activeUser.username) return;

          if (window.location.pathname.endsWith("banned.html")) return;

          const usersRef = ref(rtdb, "users");
          const snap = await get(usersRef);

          if (snap.exists()) {
              snap.forEach((child) => {
                  const uData = child.val();
                  if (uData.username && uData.username.toLowerCase() === activeUser.username.toLowerCase()) {
                      if (uData.banned === true) {
                          window.location.href = "banned.html";
                      }
                  }
              });
          }
      } catch (e) {
          console.error("Restriction check error:", e);
      }
  }

  enforceBanRestrictions();
