<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatter - Direct Messages</title>
  <link rel="icon" type="image/x-icon" href="assets/favicon.png">
  <style>
    /* STABLE ELEMENT ANCHORING */
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    html, body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #ffffff;
        color: #1a1a1b;
        height: 100%;
        overflow: hidden;
    }

    .navbar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 56px;
        background: #ffffff;
        border-bottom: 1px solid #edeff1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        z-index: 10;
    }
    .nav-logo { height: 32px; }
    .welcome-text { font-size: 0.9rem; font-weight: 600; color: #4a4a4a; }

    .btn {
        font-size: 14px;
        font-weight: 700;
        padding: 6px 16px;
        border-radius: 9999px;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        border: 1px solid transparent;
    }
    .btn-outline { border-color: #ff0000; color: #ff0000; background: transparent; }
    .btn-filled { background-color: #ff0000; color: white; }

    /* INNER CONTAINER FRAME */
    .dm-wrapper {
        position: absolute;
        top: 56px;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        overflow: hidden;
    }

    /* SIDEBAR COMPONENT */
    .dm-sidebar {
        width: 280px;
        border-right: 1px solid #edeff1;
        display: flex;
        flex-direction: column;
        background: #ffffff;
        overflow: hidden;
    }
    .sidebar-tabs {
        display: flex;
        border-bottom: 1px solid #edeff1;
        background: #f6f7f8;
    }
    .tab-btn {
        flex: 1;
        padding: 12px 6px;
        background: none;
        border: none;
        font-size: 11px;
        font-weight: 700;
        color: #787c7e;
        cursor: pointer;
        text-align: center;
    }
    .tab-btn.active {
        color: #ff0000;
        background-color: #ffffff;
        border-bottom: 2px solid #ff0000;
    }
    .search-box-container { padding: 12px; border-bottom: 1px solid #edeff1; }
    .search-input {
        width: 100%;
        padding: 8px 12px;
        border: 1px solid #edeff1;
        border-radius: 20px;
        font-size: 14px;
        background-color: #f6f7f8;
        outline: none;
    }
    .search-input:focus { border-color: #ff0000; background-color: #ffffff; }
    .users-list { flex: 1; overflow-y: auto; background: #ffffff; }
    .user-item { padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #f6f7f8; }
    .user-item.active { background-color: rgba(255, 0, 0, 0.05); border-right: 3px solid #ff0000; }
    .user-item-subtext { font-size: 11px; color: #787c7e; display: block; margin-top: 2px; }

    /* CHAT CORE INTERFACE */
    .chat-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: #ffffff;
        position: relative;
        overflow: hidden;
    }
    .chat-header {
        height: 56px;
        border-bottom: 1px solid #edeff1;
        padding: 0 20px;
        display: flex;
        align-items: center;
        font-weight: 600;
        font-size: 16px;
    }
    
    /* SCROLLABLE BOUNDED VIEWPORT */
    .messages-viewport {
        position: absolute;
        top: 56px;
        bottom: 73px;
        left: 0;
        right: 0;
        padding: 20px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    /* BUBBLES & MODERATION UI */
    .message-row { display: flex; flex-direction: column; max-width: 70%; position: relative; }
    .message-row.incoming { align-self: flex-start; }
    .message-row.outgoing { align-self: flex-end; }
    .message-row.admin-interjected { align-self: center; max-width: 85%; text-align: center; }
    .message-meta { font-size: 11px; color: #787c7e; margin-bottom: 4px; display: flex; gap: 8px; align-items: center; }
    .message-row.outgoing .message-meta { align-self: flex-end; }
    .message-bubble { padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.5; word-break: break-word; }
    .incoming .message-bubble { background-color: #f6f7f8; color: #1a1a1b; border-top-left-radius: 4px; }
    .outgoing .message-bubble { background-color: #ff0000; color: #ffffff; border-top-right-radius: 4px; }
    .admin-interjected .message-bubble { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; border-radius: 8px; font-style: italic; }
    
    /* Admin Control Buttons Layout */
    .admin-actions { font-size: 10px; display: inline-flex; gap: 6px; margin-left: 6px; }
    .admin-actions span { cursor: pointer; text-decoration: underline; font-weight: bold; color: #b11b1b; }
    .admin-actions span.edit-btn { color: #0066cc; }

    /* ANCHORED CHAT INPUT SECTION */
    .chat-input-area {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 73px;
        padding: 16px;
        border-top: 1px solid #edeff1;
        background: #ffffff;
    }
    .input-form { display: flex; gap: 12px; align-items: center; }
    .message-text-input {
        flex: 1;
        padding: 12px 16px;
        border: 1px solid #edeff1;
        border-radius: 24px;
        font-size: 14px;
        outline: none;
    }
    .message-text-input:focus { border-color: #ff0000; }
    
    .placeholder-view {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #787c7e;
        font-size: 15px;
        gap: 8px;
    }
  </style>
</head>
<body>

<header class="navbar">
  <div class="nav-left">
    <a href="home.html"><img src="assets/CHATTER_PNG.png" alt="Chatter" class="nav-logo"></a>
  </div>
  <div class="nav-right">
    <span id="welcomeUser" class="welcome-text" style="display: none;"></span>
    <a class="btn btn-outline" href="home.html">Back to Feed</a>
  </div>
</header>

<div class="dm-wrapper">
    <aside class="dm-sidebar">
        <div class="sidebar-tabs" id="sidebarTabsContainer">
            <button id="tabUsers" class="tab-btn active">Users</button>
            <button id="tabChatting" class="tab-btn">Chats</button>
        </div>
        <div class="search-box-container">
            <input type="text" id="userSearchInput" class="search-input" placeholder="Search accounts..." />
        </div>
        <div class="users-list" id="usersListContainer"></div>
    </aside>

    <main class="chat-container" id="chatMainContainer">
        <div class="placeholder-view">
            <div style="font-size: 32px;"></div>
            <div>Select a user or active thread from the list to begin.</div>
        </div>
    </main>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, get, push, set, update, remove, onValue, off } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAyKbmWh1MZJiwSQ5DVmt7Lgz9e7oY82A",
    authDomain: "new-chatter-68eb4.firebaseapp.com",
    projectId: "new-chatter-68eb4",
    storageBucket: "new-chatter-68eb4.firebasestorage.app",
    messagingSenderId: "253944755091",
    appId: "1:253944755091:web:c7891e34d97e414f9b6e66",
    databaseURL: "https://new-chatter-68eb4-default-rtdb.firebaseio.com"
  };

  const app = initializeApp(firebaseConfig);
  const rtdb = getDatabase(app);

  const currentUserJson = localStorage.getItem("currentUser");
  let activeUser = null;
  let activeUserIsAdmin = false;
  
  let cachedAllUsers = [];
  let cachedChattedUids = new Set();
  let cachedAllGlobalThreads = [];
  let currentActiveTab = "all"; 
  
  let selectedTargetUid = null;
  let selectedAdminThreadToken = null;
  let activeChatListenerRef = null;

  const usersListContainer = document.getElementById("usersListContainer");
  const userSearchInput = document.getElementById("userSearchInput");
  const chatMainContainer = document.getElementById("chatMainContainer");

  const tabUsers = document.getElementById("tabUsers");
  const tabChatting = document.getElementById("tabChatting");
  const sidebarTabsContainer = document.getElementById("sidebarTabsContainer");

  async function initializeWorkspace() {
      if (!currentUserJson) { window.location.href = "login.html"; return; }
      try {
          activeUser = JSON.parse(currentUserJson);
          if (activeUser?.username) {
              const welcomeUser = document.getElementById("welcomeUser");
              welcomeUser.textContent = `u/${activeUser.username}`;
              welcomeUser.style.display = "inline";
              
              // Apply home page async database admin verification check logic logic
              await verifyAndSetupAdminPrivileges(activeUser.username);
          }
      } catch (e) { window.location.href = "login.html"; return; }

      setupTabListeners();
      await fetchAllSystemUsersAndActiveThreads();
      userSearchInput.oninput = () => renderSidebarList(userSearchInput.value);
  }

  function setupTabListeners() {
      tabUsers.onclick = () => {
          currentActiveTab = "all";
          clearActiveTabStyles();
          tabUsers.classList.add("active");
          renderSidebarList(userSearchInput.value);
      };
      tabChatting.onclick = () => {
          currentActiveTab = "chatting";
          clearActiveTabStyles();
          tabChatting.classList.add("active");
          renderSidebarList(userSearchInput.value);
      };
  }

  function clearActiveTabStyles() {
      const tabs = sidebarTabsContainer.querySelectorAll(".tab-btn");
      tabs.forEach(t => t.classList.remove("active"));
  }

  async function verifyAndSetupAdminPrivileges(username) {
      try {
          const usersRef = ref(rtdb, "users");
          const snap = await get(usersRef);
          if (snap.exists()) {
              snap.forEach((userChild) => {
                  const userData = userChild.val();
                  if (userData.username && userData.username.toLowerCase() === username.toLowerCase()) {
                      if (userData.admin === true) {
                          activeUserIsAdmin = true;
                      }
                  }
              });
          }

          // If confirmed via database lookup or legacy local string fallback, build the UI
          if (activeUserIsAdmin || activeUser.role === "admin" || activeUser.username.toLowerCase() === "admin") {
              activeUserIsAdmin = true; // explicitly synchronize fallback states
              const adminTab = document.createElement("button");
              adminTab.id = "tabAdmin";
              adminTab.className = "tab-btn";
              adminTab.textContent = "Admin";
              adminTab.onclick = () => {
                  currentActiveTab = "admin";
                  clearActiveTabStyles();
                  adminTab.classList.add("active");
                  renderSidebarList(userSearchInput.value);
              };
              sidebarTabsContainer.appendChild(adminTab);
          }
      } catch (e) { console.error("Admin check failed: ", e); }
  }

  async function fetchAllSystemUsersAndActiveThreads() {
      try {
          const usersSnap = await get(ref(rtdb, "users"));
          const usersMap = {};
          if (usersSnap.exists()) {
              cachedAllUsers = [];
              usersSnap.forEach((child) => {
                  const data = child.val();
                  usersMap[child.key] = data.username || "Unknown Member";
                  if (child.key !== activeUser.uid && data.banned !== true) {
                      cachedAllUsers.push({ uid: child.key, username: data.username || "Unknown Member" });
                  }
              });
          }

          const dmSnap = await get(ref(rtdb, "directMessages"));
          cachedChattedUids.clear();
          cachedAllGlobalThreads = [];

          if (dmSnap.exists()) {
              dmSnap.forEach((child) => {
                  const threadKey = child.key; 
                  if (threadKey.includes(activeUser.uid)) {
                      const splitUids = threadKey.split("_");
                      const counterPartUid = splitUids.find(id => id !== activeUser.uid);
                      if (counterPartUid) cachedChattedUids.add(counterPartUid);
                  }
                  
                  const splitUids = threadKey.split("_");
                  if (splitUids.length === 2) {
                      const userA = usersMap[splitUids[0]] || splitUids[0];
                      const userB = usersMap[splitUids[1]] || splitUids[1];
                      cachedAllGlobalThreads.push({
                          token: threadKey,
                          label: `u/${userA} ⇄ u/${userB}`
                      });
                  }
              });
          }
          renderSidebarList();
      } catch (err) { console.error(err); }
  }

  function renderSidebarList(filterTerm = "") {
      usersListContainer.innerHTML = "";
      
      if (currentActiveTab === "admin") {
          const filteredThreads = cachedAllGlobalThreads.filter(t => t.label.toLowerCase().includes(filterTerm.toLowerCase()));
          if (filteredThreads.length === 0) {
              usersListContainer.innerHTML = `<div style="padding:20px; font-size:13px; color:#787c7e; text-align:center;">No active logs in database.</div>`;
              return;
          }
          filteredThreads.forEach(thread => {
              const div = document.createElement("div");
              div.className = `user-item ${selectedAdminThreadToken === thread.token ? 'active' : ''}`;
              div.innerHTML = `
                  <span style="font-size:13px; font-weight:600; color:#b11b1b;">Intercept Log</span>
                  <span class="user-item-subtext">${escapeHTML(thread.label)}</span>
              `;
              div.onclick = () => selectAdminThreadTarget(thread);
              usersListContainer.appendChild(div);
          });
          return;
      }

      let dataset = (currentActiveTab === "all") ? cachedAllUsers : cachedAllUsers.filter(u => cachedChattedUids.has(u.uid));
      const filtered = dataset.filter(u => u.username.toLowerCase().includes(filterTerm.toLowerCase()));

      if (filtered.length === 0) {
          usersListContainer.innerHTML = `<div style="padding:20px; font-size:13px; color:#787c7e; text-align:center;">No accounts found.</div>`;
          return;
      }

      filtered.forEach(user => {
          const div = document.createElement("div");
          div.className = `user-item ${selectedTargetUid === user.uid && selectedAdminThreadToken === null ? 'active' : ''}`;
          div.innerHTML = `<span style="font-size:14px; font-weight:600;">u/${escapeHTML(user.username)}</span>`;
          div.onclick = () => selectChatTarget(user);
          usersListContainer.appendChild(div);
      });
  }

  function selectChatTarget(targetUser) {
      selectedAdminThreadToken = null;
      if (selectedTargetUid === targetUser.uid) return;
      selectedTargetUid = targetUser.uid;
      
      document.querySelectorAll(".user-item").forEach(el => el.classList.remove("active"));
      renderSidebarList(userSearchInput.value);
      if (activeChatListenerRef) off(activeChatListenerRef);
      setupChatViewElement(targetUser, null);
  }

  function selectAdminThreadTarget(thread) {
      selectedTargetUid = null;
      if (selectedAdminThreadToken === thread.token) return;
      selectedAdminThreadToken = thread.token;

      document.querySelectorAll(".user-item").forEach(el => el.classList.remove("active"));
      renderSidebarList(userSearchInput.value);
      if (activeChatListenerRef) off(activeChatListenerRef);
      setupChatViewElement(null, thread);
  }

  function setupChatViewElement(targetUser, adminThread) {
      let headerLabel = "";
      let channelToken = "";
      let placeholderText = "";

      if (adminThread) {
          headerLabel = `${adminThread.label}`;
          channelToken = adminThread.token;
          placeholderText = "Interject...";
      } else {
          headerLabel = `u/${targetUser.username}`;
          channelToken = activeUser.uid < targetUser.uid ? `${activeUser.uid}_${targetUser.uid}` : `${targetUser.uid}_${activeUser.uid}`;
          placeholderText = `Message u/${targetUser.username}...`;
      }

      chatMainContainer.innerHTML = `
          <div class="chat-header" style="${adminThread ? 'background-color:#fff3cd; color:#856404; border-bottom:1px solid #ffeeba;' : ''}">${escapeHTML(headerLabel)}</div>
          <div class="messages-viewport" id="messagesViewport"></div>
          <div class="chat-input-area">
              <form id="chatSubmissionForm" class="input-form">
                  <input type="text" id="chatMessageInput" class="message-text-input" placeholder="${escapeHTML(placeholderText)}" autocomplete="off" />
                  <button type="submit" class="btn btn-filled">Send</button>
              </form>
          </div>
      `;

      const viewport = document.getElementById("messagesViewport");
      const form = document.getElementById("chatSubmissionForm");
      const input = document.getElementById("chatMessageInput");

      activeChatListenerRef = ref(rtdb, `directMessages/${channelToken}`);

      onValue(activeChatListenerRef, (snapshot) => {
          viewport.innerHTML = "";
          if (snapshot.exists()) {
              snapshot.forEach((child) => {
                  const messageId = child.key;
                  const msg = child.val();
                  
                  if (!msg) return; // Safeguard if object is null
                  const rawText = msg.text || "";

                  let rowClass = "incoming";
                  let metadataText = msg.senderUsername ? `u/${msg.senderUsername}` : "User";

                  if (msg.senderId === activeUser.uid) {
                      rowClass = "outgoing";
                      metadataText = "You";
                  } else if (msg.isAdminInterjection === true) {
                      rowClass = "admin-interjected";
                      metadataText = `Admin Interjection (${msg.senderUsername || 'Staff'})`;
                  } else if (!adminThread && msg.senderId !== activeUser.uid) {
                      rowClass = "incoming";
                      metadataText = `u/${targetUser.username}`;
                  } else if (adminThread) {
                      rowClass = "incoming";
                      metadataText = msg.senderUsername ? `u/${msg.senderUsername}` : `ID: ${msg.senderId}`;
                  }

                  const row = document.createElement("div");
                  row.className = `message-row ${rowClass}`;
                  const dateLabel = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '';
                  
                  let adminControlsHTML = "";
                  if (activeUserIsAdmin) {
                      adminControlsHTML = `
                          <span class="admin-actions">
                              <span class="edit-btn" data-msg-id="${messageId}">[Edit]</span>
                              <span class="delete-btn" data-msg-id="${messageId}">[Delete]</span>
                          </span>
                      `;
                  }

                  row.innerHTML = `
                      <span class="message-meta">${metadataText} • ${dateLabel} ${adminControlsHTML}</span>
                      <div class="message-bubble">${escapeHTML(rawText)}</div>
                  `;
                  
                  if (adminControlsHTML !== "") {
                      row.querySelector(".delete-btn").onclick = () => triggerAdminDelete(channelToken, messageId);
                      row.querySelector(".edit-btn").onclick = () => triggerAdminEdit(channelToken, messageId, rawText);
                  }

                  viewport.appendChild(row);
              });
              viewport.scrollTop = viewport.scrollHeight;
          } else {
              viewport.innerHTML = `
                <div style="text-align:center; padding-top:60px; color:#787c7e; font-size:14px;">
                    <div style="font-size:32px; margin-bottom:10px;"></div>
                    No conversation records found inside this tracking node.
                </div>`;
          }
      });

      form.onsubmit = async (e) => {
          e.preventDefault();
          const messageText = input.value.trim();
          if (!messageText) return;
          input.value = "";
          
          try {
              const msgRef = push(ref(rtdb, `directMessages/${channelToken}`));
              const dataPayload = {
                  senderId: activeUser.uid,
                  senderUsername: activeUser.username,
                  text: messageText,
                  timestamp: Date.now()
              };

              if (adminThread) {
                  dataPayload["isAdminInterjection"] = true;
              }

              await set(msgRef, dataPayload);
              
              if (!adminThread && !cachedChattedUids.has(targetUser.uid)) {
                  cachedChattedUids.add(targetUser.uid);
                  if (currentActiveTab === "chatting") renderSidebarList(userSearchInput.value);
              }
          } catch (err) { alert("Message delivery dropped: " + err.message); }
      };
  }

  async function triggerAdminDelete(channelToken, messageId) {
      if (!confirm("Are you sure you want to completely delete this message as an Administrator?")) return;
      try {
          await remove(ref(rtdb, `directMessages/${channelToken}/${messageId}`));
      } catch (err) {
          alert("Failed to modify database: " + err.message);
      }
  }

  async function triggerAdminEdit(channelToken, messageId, currentText) {
      const updatedText = prompt("Modify target content payload string:", currentText);
      if (updatedText === null) return; 
      const cleanUpdate = updatedText.trim();
      if (!cleanUpdate) {
          alert("Content cannot be empty. Use delete instead.");
          return;
      }
      try {
          await update(ref(rtdb, `directMessages/${channelToken}/${messageId}`), {
              text: cleanUpdate
          });
      } catch (err) {
          alert("Failed to sync structural changes: " + err.message);
      }
  }

  function escapeHTML(str) {
      if (!str) return '';
      return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
  }

  initializeWorkspace();
</script>
</body>
</html>
